            <div class="flex items-start gap-3 mb-3">
                <div class="w-9 h-9 rounded-full bg-rose-950/80 border border-rose-500/40 flex items-center justify-center flex-shrink-0 text-rose-400">
                    <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                        <line x1="9" y1="10" x2="15" y2="10"></line>
                    </svg>
                </div>
                <div class="flex-1 min-w-0">
                    <h3 id="bookmark-remove-dialog-title" class="text-sm font-semibold text-slate-100 leading-snug">
                        ブックマークを解除しますか？
                    </h3>
                    <p id="bookmark-remove-dialog-desc" class="text-xs text-slate-400 mt-1 leading-relaxed">
                        このアイテムをブックマーク一覧から削除します。
                    </p>
                </div>
            </div>

            <!-- Target item preview -->
            <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 mb-4 flex items-center gap-2.5">
                <div class="flex-1 min-w-0">
                    <p id="bookmark-remove-target-title" class="text-xs font-medium text-slate-200 truncate"></p>
                    <span id="bookmark-remove-target-id" class="text-[10px] font-mono text-cyan-400 block mt-0.5"></span>
                </div>
            </div>

            <!-- Action buttons -->
            <div class="flex items-center justify-end gap-2">
                <button
                    type="button"
                    id="bookmark-remove-cancel-btn"
                    class="px-3.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700/90 border border-slate-700/60 text-slate-300 hover:text-white text-xs font-medium transition-all cursor-pointer"
                >
                    キャンセル
                </button>
                <button
                    type="button"
                    id="bookmark-remove-confirm-btn"
                    class="px-3.5 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold shadow-lg shadow-rose-950/50 hover:shadow-rose-900/60 transition-all cursor-pointer"
                >
                    解除する
                </button>
            </div>
        </div>
    </div>

    <script src="index.js" defer></script>
</body>
</html>
