name: Verify ImagineDeck Fullscreen Recovery

on:
  pull_request:
    branches:
      - museum-portal
    paths:
      - 'public/imaginedeck/**'
      - 'public/sw.js'
      - 'public/sw-core-v44.js'
      - 'test-imaginedeck-fullscreen-guard.cjs'
      - '.github/workflows/verify-imaginedeck-fullscreen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        run: |
          node --check public/imaginedeck/fullscreen-guard.js
          node --check public/sw.js
          node --check test-imaginedeck-fullscreen-guard.cjs

      - name: Test fullscreen recovery state machine and transition-safe shell wiring
        run: node --test test-imaginedeck-fullscreen-guard.cjs
