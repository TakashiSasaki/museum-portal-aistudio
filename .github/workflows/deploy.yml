name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Preflight check for FIREBASE_TOKEN
        run: |
          if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
            echo "::error::FIREBASE_TOKEN secret is not set in this repository. Please add FIREBASE_TOKEN to repository secrets before deploying."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run static integrity contract tests
        run: bun run test:static

      - name: Run ImagineDeck fullscreen guard tests
        run: bun run test:imaginedeck

      - name: Install Playwright Chromium
        run: bun x playwright install --with-deps chromium

      - name: Start preview server
        run: |
          node server.js &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:3000/healthz > /dev/null 2>&1 || curl -s -f http://127.0.0.1:3000/ > /dev/null 2>&1; then
              echo "Preview server is ready on port 3000"
              break
            fi
            sleep 0.2
          done

      - name: Run preview server contract tests
        run: bun run test:server

      - name: Run browser smoke tests
        run: bun run test:browser

      - name: Stop preview server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload diagnostic screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-smoke-screenshots
          path: diagnostic-screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy to Firebase Hosting
        run: bun x firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
