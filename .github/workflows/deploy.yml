name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - museum-portal
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE22: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Run static integrity contract tests
        run: node --test test-static-integrity.cjs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static web server
        run: |
          python3 -m http.server 3000 --directory public &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 2

      - name: Run browser smoke tests
        run: node test-browser-smoke.cjs

      - name: Stop static web server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill "$SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload diagnostic screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-smoke-screenshots
          path: diagnostic-screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Deploy to Firebase Hosting
        run: npx --yes firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
